<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2342">
<title>UTHO SmartCloud Optimizer</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <svg class="brand-mark" width="56" height="41" viewBox="20 10 670 485" aria-hidden="true">
        <defs>
          <linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="490">
            <stop offset="0" style="stop-color:var(--logo-1)"/><stop offset="1" style="stop-color:var(--logo-2)"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#brandGrad)" stroke-width="45">
          <path d="M175 125 A212 212 0 0 1 515 125"/>
          <path d="M175 378 A212 212 0 0 0 345 464"/>
          <path d="M388 463 A212 212 0 0 0 520 366"/>
          <path d="M52 145 V290 A60 60 0 0 0 172 290 V200"/>
          <path d="M145 167 H352 M250 167 V372"/>
          <path d="M330 195 V480 M330 282 H510 M432 145 V370"/>
          <ellipse cx="575" cy="258" rx="82" ry="91"/>
        </g>
      </svg>
      <div><div class="brand-name">UTHO</div><div class="brand-sub">SmartCloud Optimizer</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <span class="ts-label">Theme</span>
      <div class="ts-btns">
        <button type="button" data-theme-set="blue" aria-pressed="true" title="Blue theme">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7s6 6.1 6 10.5a6 6 0 0 1-12 0c0-4.4 6-10.5 6-10.5z"/></svg><span>Blue</span>
        </button>
        <button type="button" data-theme-set="white" aria-pressed="false" title="White theme">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>White</span>
        </button>
        <button type="button" data-theme-set="black" aria-pressed="false" title="Black theme">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Black</span>
        </button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="view" class="view" tabindex="-1"><div class="loading">Loading…</div></div>
  </main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/auth.js"></script>
<script src="/app.js"></script>
</body>
</html>
